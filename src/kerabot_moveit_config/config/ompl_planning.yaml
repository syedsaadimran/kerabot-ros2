# =============================================================================
# ompl_planning.yaml — Kerabot MoveIt2 Planning Pipeline Configuration
#
# PIPELINE STACK (applied in order):
#   1. Pilz PTP  → deterministic trapezoidal velocity profile
#   2. AddRuckigTrajectorySmoothing → rounds sharp ramp corners into S-curves,
#      enforcing jerk limits from joint_limits.yaml. Eliminates mechanical shock
#      at ramp-up / ramp-down transitions.
#
# Result: smooth, jerk-limited, trapezoidal-shaped motion — industrial grade.
#
# FALLBACK pipeline (named "ompl"):
#   OMPL RRTConnect — for obstacle-aware / constrained planning when Pilz
#   geometry is insufficient. Also uses Ruckig post-processing.
# =============================================================================

# ── Primary pipeline: Pilz + Ruckig ──────────────────────────────────────────
planning_plugin: pilz_industrial_motion_planner/CommandPlanner

request_adapters: >-
    default_planner_request_adapters/AddRuckigTrajectorySmoothing
    default_planner_request_adapters/FixWorkspaceBounds
    default_planner_request_adapters/FixStartStateBounds
    default_planner_request_adapters/FixStartStateCollision
    default_planner_request_adapters/FixStartStatePathConstraints

# Ruckig smoothing iterations — more = smoother corners, but slightly longer
# planning time. 3 iterations is sufficient for industrial repeatability.
smoothing_type: 2        # 1 = TimeOptimalTrajectoryGeneration, 2 = Ruckig

# ── OMPL pipeline (named fallback) ───────────────────────────────────────────
# Use this for obstacle-aware planning or when Pilz cannot find a path.
# Switch at runtime: set planning_pipeline="ompl" in your MoveGroup request.
ompl:
  planning_plugin: ompl_interface/OMPLPlanner
  request_adapters: >-
      default_planner_request_adapters/AddRuckigTrajectorySmoothing
      default_planner_request_adapters/FixWorkspaceBounds
      default_planner_request_adapters/FixStartStateBounds
      default_planner_request_adapters/FixStartStateCollision
      default_planner_request_adapters/FixStartStatePathConstraints
  start_state_max_bounds_error: 0.1

  arm:
    default_planner_config: RRTConnect
    planner_configs:
      - RRTConnect
    projection_evaluator: joints(Revolute_1,Revolute_2)
    longest_valid_segment_fraction: 0.005

  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0
