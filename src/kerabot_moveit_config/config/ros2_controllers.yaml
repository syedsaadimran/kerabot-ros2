# This config file is used by ros2_control & gazebo_ros2_control
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - Revolute_1
      - Revolute_2
      - Revolute_3
      - Revolute_4
      - Revolute_5
      - ee_rotation_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: true
    gains:
      Revolute_1: {p: 2000.0, d: 40.0, i: 1.0, i_clamp: 10.0}
      Revolute_2: {p: 4500.0, d: 60.0, i: 5.0, i_clamp: 20.0}
      Revolute_3: {p: 3500.0, d: 50.0, i: 5.0, i_clamp: 15.0}
      Revolute_4: {p: 1500.0, d: 25.0, i: 1.0, i_clamp: 10.0}
      Revolute_5: {p: 1500.0, d: 25.0, i: 1.0, i_clamp: 10.0}
      ee_rotation_joint: {p: 1000.0, d: 15.0, i: 0.5, i_clamp: 5.0}
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
